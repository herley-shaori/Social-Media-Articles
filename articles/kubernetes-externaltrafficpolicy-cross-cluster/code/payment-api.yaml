apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    app.kubernetes.io/name: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
    spec:
      nodeSelector:
        lab.example/role: api
      containers:
        - name: api
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo 'payment-api-ok' > /www/index.html
              httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  labels:
    app.kubernetes.io/name: payment-api
spec:
  type: NodePort
  # The script first demonstrates the working path using Cluster, then switches
  # to Local without changing the node it calls.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: payment-api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: 30080
